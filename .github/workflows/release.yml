name: Build & Release

on:
  repository_dispatch:
    types: [build-node]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0). Leave empty for edge build."
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Aktoh-Cyber/synapse
          token: ${{ secrets.SOURCE_REPO_PAT }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            synapse-fabric/go.sum
            synapse-node/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY_NAME="synapse-node-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags="-s -w" -o "${BINARY_NAME}" ./synapse-node/cmd/synapse-node

      - name: Package binary
        run: |
          BINARY_NAME="synapse-node-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "synapse-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${BINARY_NAME}"
          else
            tar czf "synapse-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${BINARY_NAME}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: synapse-node-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout dist repo
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-linux-*
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="edge"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$( [ "$VERSION" != "edge" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_release }}
            type=raw,value=edge,enable=${{ steps.version.outputs.version == 'edge' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Make package public
        run: |
          # Try org-level first, then user-level
          curl -sf -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/synapse-node" \
            -d '{"visibility":"public"}' && echo "Package set to public" || \
          echo "Could not set visibility (may need org admin)"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    if: ${{ github.event.inputs.version || github.event.client_payload.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          sha256sum synapse-node-*.tar.gz synapse-node-*.zip > checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Synapse Node ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            synapse-node-*.tar.gz
            synapse-node-*.zip
            checksums.txt
